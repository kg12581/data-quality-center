[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-center"
version = "3.1.0"
description = "规则写在 YAML 的数据质量校验工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=1.5", "PyYAML>=6.0"]

[project.optional-dependencies]
db = ["SQLAlchemy>=2.0"]
bigdata = ["SQLAlchemy>=2.0", "jaydebeapi>=1.2", "JPype1>=1.5"]
mysql = ["PyMySQL>=1.1"]
postgresql = ["psycopg2-binary>=2.9"]
odps = ["pyodps>=0.11"]
report = ["tabulate>=0.9"]
dev = ["pytest>=7.0"]
lint = ["ruff>=0.6"]

[tool.setuptools]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".git", ".venv", "reports", "testcase"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # 行长交给 line-length 控制，中文注释不强制折行
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
